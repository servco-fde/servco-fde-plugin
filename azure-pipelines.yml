# Validation for this plugin repository. Application deployment belongs in each app repo.
trigger:
  branches:
    include:
      - '*'

# Azure Repos PR checks require a build-validation branch policy.
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: Select Python
  - script: python -m pip install -r requirements-dev.txt
    displayName: Install validation dependencies
  - script: python scripts/validate.py
    displayName: Validate plugin and skills
